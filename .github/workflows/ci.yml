name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python with ruff
        run: ruff check app/ --ignore E501,W291,W293
        continue-on-error: false

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t statuspulse:ci .

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          DB_NAME=statuspulse
          DB_USER=statuspulse_user
          DB_PASSWORD=ci_test_password_123
          REDIS_PASSWORD=ci_redis_password_123
          APP_PORT=8000
          EOF

      - name: Start full stack
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          for i in $(seq 1 12); do
            STATUS=$(docker compose ps --format json | python3 -c "
          import sys, json
          data = sys.stdin.read().strip().split('\n')
          healthy = all('healthy' in line or 'running' in line for line in data if line)
          print('ok' if healthy else 'wait')
          " 2>/dev/null || echo "wait")
            echo "Attempt $i: $STATUS"
            if curl -sf http://localhost:8000/health > /dev/null 2>&1; then
              echo "App is ready!"
              break
            fi
            sleep 10
          done

      - name: Check all services healthy
        run: |
          docker compose ps
          curl -sf http://localhost:8000/health | python3 -m json.tool

      - name: Run integration tests
        run: |
          chmod +x tests/test_integration.sh
          BASE_URL=http://localhost:8000 bash tests/test_integration.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/
          retention-days: 7