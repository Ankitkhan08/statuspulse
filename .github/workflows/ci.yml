name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Python with ruff
        uses: chartboost/ruff-action@v1
        with:
          args: check app/

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t statuspulse:ci .

      - name: Create .env file
        run: |
          cat > .env << EOF
          DB_NAME=statuspulse
          DB_USER=statuspulse_user
          DB_PASSWORD=ci_test_password_123
          REDIS_PASSWORD=ci_redis_password_123
          APP_PORT=8000
          EOF

      - name: Start full stack
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check all services healthy
        run: docker compose ps

      - name: Run integration tests
        run: |
          chmod +x tests/test_integration.sh
          BASE_URL=http://localhost:8000 bash tests/test_integration.sh

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/
          retention-days: 7